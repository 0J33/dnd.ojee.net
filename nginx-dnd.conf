# nginx site for dnd.ojee.net + dnd-api.ojee.net on disinteg.
# Installed at /etc/nginx/sites-available/dnd (symlinked into sites-enabled).
# This copy is the record; editing it changes nothing until it's installed
# (sudo cp, then `sudo nginx -t && sudo systemctl reload nginx`).

server {
    listen 80;
    server_name dnd-api.ojee.net;

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
server {
    listen 80;
    server_name dnd.ojee.net;

    root /home/disinteg/dnd-client;
    index index.html;

    # Vite's hashed build files never change under the same name, so they can
    # be cached for good - and a missing one is a 404. Falling back to
    # index.html here used to hand the browser HTML where it asked for a
    # script, which it then tried to run.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page and the build id are always revalidated, so a deploy is picked
    # up on the next load instead of whenever a heuristic cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Client-side routes (/invite/CODE) serve the app; that internal redirect
    # lands in the /index.html block above and gets its no-cache header.
    location / {
        try_files $uri /index.html;
    }
}
